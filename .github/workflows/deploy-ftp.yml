name: Deploy to hosting (FTP)

# Use this instead of the Pages deploy at the end of update-data.yml if your hosting is
# classic shared hosting (cPanel, Plesk, etc.) reached over FTP/FTPS.
#
# Repo secrets needed (Settings -> Secrets and variables -> Actions -> New repository secret):
#   FTP_HOST      e.g. ftp.yourdomain.com
#   FTP_USERNAME  your FTP account
#   FTP_PASSWORD  its password
#   SITE_URL      e.g. https://yourdomain.com  (used so course pages get correct canonical links)
#
# If your host's FTP root is not the public web folder, add server-dir below, e.g.
# server-dir: /public_html/

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update course data", "Update course descriptions", "Update seats"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  # Seats refresh every 15 minutes and most runs change nothing; deploying after each of those
  # would reconnect to the host for no reason. If the seats run left the repo exactly where it
  # started (HEAD is still the commit it ran on) there is nothing new to publish.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        run: |
          go=true
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.name }}" = "Update seats" ] \
             && [ "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}" ]; then
            go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "deploy: $go"

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-render course pages for search engines
        run: python build_pages.py --base "${{ secrets.SITE_URL }}"

      - name: Stamp asset URLs so browsers never pair a new page with an old script
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -e "s|href=\"app.css\"|href=\"app.css?v=$v\"|" \
                 -e "s|src=\"app.js\"|src=\"app.js?v=$v\"|" \
                 -e "s|src=\"config.js\"|src=\"config.js?v=$v\"|" index.html
          grep -n "?v=$v" index.html

      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*/**
            **/.github/**
            **/tests/**
            **/scraper/tests/**
            **/node_modules/**
            **/dist/**
