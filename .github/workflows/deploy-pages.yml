name: Deploy to GitHub Pages

# Alternative to deploy-ftp.yml / deploy-ssh.yml, if you'd rather use GitHub's own free
# hosting. Requires Settings -> Pages -> Source: GitHub Actions (see README).

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update course data"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/configure-pages@v5
        id: pages

      - name: Pre-render course pages for search engines
        run: python build_pages.py --base "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
