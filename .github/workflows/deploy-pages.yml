name: Deploy to GitHub Pages

# Alternative to deploy-ftp.yml / deploy-ssh.yml, if you'd rather use GitHub's own free
# hosting. Requires Settings -> Pages -> Source: GitHub Actions (see README).

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update course data", "Update course descriptions", "Update seats"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Seats refresh every 15 minutes and most runs change nothing; deploying after each of those
  # would reconnect to the host for no reason. If the seats run left the repo exactly where it
  # started (HEAD is still the commit it ran on) there is nothing new to publish.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        run: |
          go=true
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.name }}" = "Update seats" ] \
             && [ "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}" ]; then
            go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "deploy: $go"

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/configure-pages@v5
        id: pages

      - name: Pre-render course pages for search engines
        run: python build_pages.py --base "${{ steps.pages.outputs.base_url }}"

      - name: Stamp asset URLs so browsers never pair a new page with an old script
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -e "s|href=\"app.css\"|href=\"app.css?v=$v\"|" \
                 -e "s|src=\"app.js\"|src=\"app.js?v=$v\"|" \
                 -e "s|src=\"config.js\"|src=\"config.js?v=$v\"|" index.html
          grep -n "?v=$v" index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
