name: Deploy to hosting (SSH / rsync)

# Use this instead of the Pages deploy if your hosting is a VPS or anything reachable over SSH.
#
# Repo secrets needed:
#   SSH_HOST        server address
#   SSH_USER        ssh username
#   SSH_KEY         private key with access to that account (Settings -> Secrets, paste the
#                   full PEM contents; add the matching public key to the server's authorized_keys)
#   SSH_TARGET_DIR  absolute path to the site's public folder, e.g. /var/www/sumods
#   SITE_URL        e.g. https://yourdomain.com

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update course data", "Update course descriptions", "Update seats"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  # Seats refresh every 15 minutes and most runs change nothing; deploying after each of those
  # would reconnect to the host for no reason. If the seats run left the repo exactly where it
  # started (HEAD is still the commit it ran on) there is nothing new to publish.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        run: |
          go=true
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.name }}" = "Update seats" ] \
             && [ "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}" ]; then
            go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "deploy: $go"

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-render course pages for search engines
        run: python build_pages.py --base "${{ secrets.SITE_URL }}"

      - name: Stamp asset URLs so browsers never pair a new page with an old script
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -e "s|href=\"app.css\"|href=\"app.css?v=$v\"|" \
                 -e "s|src=\"app.js\"|src=\"app.js?v=$v\"|" \
                 -e "s|src=\"config.js\"|src=\"config.js?v=$v\"|" index.html
          grep -n "?v=$v" index.html

      - name: Upload over rsync/SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: ./
          remote_path: ${{ secrets.SSH_TARGET_DIR }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
          exclude: |
            .git*/
            .github/
            tests/
            scraper/tests/
            node_modules/
            dist/
