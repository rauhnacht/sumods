name: Update course descriptions

on:
  schedule:
    - cron: "40 3 * * 0"   # Sundays
  workflow_dispatch:
    inputs:
      term:
        description: "Term code (blank = newest in data/terms.json)"
        required: false
      refresh:
        description: "Re-fetch courses already stored"
        type: boolean
        default: false
      programs:
        description: "Degree requirements: programme codes to test, space-separated (blank = all 12)"
        required: false
      entries:
        description: "Degree requirements: entry terms to test, space-separated (blank = every year since 2019)"
        required: false

permissions:
  contents: write

concurrency:
  group: sumods-data-write
  cancel-in-progress: false

jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Fetch syllabus and catalog details
        run: |
          python -u scraper/details.py --delay 1.0 \
            ${{ inputs.term && format('--term {0}', inputs.term) || '' }} \
            ${{ inputs.refresh && '--refresh' || '' }}
      - name: Degree requirements (all programmes/entries unless scoped above)
        continue-on-error: true
        run: |
          python -u scraper/programs.py \
            ${{ inputs.programs && format('--programs {0}', inputs.programs) || '' }} \
            ${{ inputs.entries && format('--entries {0}', inputs.entries) || '' }}

      - name: Commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "sumods-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "data: course details $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          else
            echo "No changes."
          fi
