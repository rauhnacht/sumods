name: Update course descriptions

on:
  schedule:
    - cron: "40 3 * * 0"   # Sundays
  workflow_dispatch:
    inputs:
      term:
        description: "Term code (blank = newest in data/terms.json)"
        required: false
      refresh:
        description: "Re-fetch courses already stored"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Fetch syllabus and catalog details
        run: |
          python scraper/details.py --delay 1.0 \
            ${{ inputs.term && format('--term {0}', inputs.term) || '' }} \
            ${{ inputs.refresh && '--refresh' || '' }}
      - name: Degree requirements (every programme, entry terms since 2019)
        continue-on-error: true
        run: python scraper/programs.py

      - name: Commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "sumods-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "data: course details $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes."
          fi
