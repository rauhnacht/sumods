name: Update course descriptions

on:
  schedule:
    - cron: "40 3 * * 0"   # Sundays
  workflow_dispatch:
    inputs:
      term:
        description: "Term code (blank = the term in session and the next one)"
        required: false
      refresh:
        description: "Re-fetch everything already stored"
        type: boolean
        default: false
      programs:
        description: "Degree requirements: programme codes, space-separated (blank = all 12)"
        required: false
      entries:
        description: "Degree requirements: entry terms, space-separated (blank = every year since 2019)"
        required: false

permissions:
  contents: write

concurrency:
  group: sumods-data-write
  cancel-in-progress: false

# Each script stops itself inside its budget and saves what it has, and each result is committed
# as soon as it exists (even if a later step fails), so a slow BannerWeb day costs time, never work.
# Anything unfinished is picked up by the next run.
jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt

      - name: Course details (BannerWeb catalog)
        continue-on-error: true
        run: |
          python -u scraper/details.py --budget 35 --delay 0.3 \
            ${{ inputs.term && format('--term {0}', inputs.term) || '' }} \
            ${{ inputs.refresh && '--refresh' || '' }}

      - name: Commit course details
        if: always()
        run: bash .github/commit-data.sh "data: course details $(date -u +%Y-%m-%d)"

      - name: Degree requirements
        continue-on-error: true
        run: |
          python -u scraper/programs.py --budget 30 \
            ${{ inputs.programs && format('--programs {0}', inputs.programs) || '' }} \
            ${{ inputs.entries && format('--entries {0}', inputs.entries) || '' }} \
            ${{ inputs.refresh && '--refresh' || '' }}

      - name: Commit degree requirements
        if: always()
        run: bash .github/commit-data.sh "data: degree requirements $(date -u +%Y-%m-%d)"
