name: Update seats

# Every 30 minutes; the script itself only does a full pass during registration and add/drop
# (dates from data/<term>-calendar.json) and once a day otherwise.
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min; --auto below keeps this to once a day outside registration/add-drop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sumods-data-write
  cancel-in-progress: false

jobs:
  seats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python -u scraper/seats.py --auto
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "sumods-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "data: seats $(date -u +%H:%MZ)"
            git pull --rebase
            git push
          fi
